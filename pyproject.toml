[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbshift"
version = "0.1.0"
description = "TB-Recertify: does a chest X-ray TB rule-out guarantee survive a new hospital? Research prototype."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adarsh Gupta" }]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "pillow",
    "pyyaml",
    # Install torch + torchvision FIRST from the PyTorch CUDA index (see README),
    # otherwise pip pulls the CPU-only build on Windows.
    "torch",
    "torchvision",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
# Demo backend. Plain uvicorn: the [standard] extras add compiled
# packages that Windows Smart App Control may block, and are not needed.
api = ["fastapi", "uvicorn", "pydantic", "python-multipart"]

# The package lives in src/tbshift ("src layout").
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so tests can import the demo backend
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
